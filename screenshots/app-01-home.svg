<svg xmlns="http://www.w3.org/2000/svg" width="300" height="650" viewBox="0 0 300 650" role="img" aria-label="Aiserie Tracks home screen">
  <defs>
    <linearGradient id="bez" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E4630"/>
      <stop offset="1" stop-color="#0A2418"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F4430"/>
      <stop offset="1" stop-color="#0A2C1C"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.85" cy="0.10" r="0.55">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.08" cy="0.85" r="0.55">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="av" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <clipPath id="scr"><rect x="10" y="10" width="280" height="630" rx="24"/></clipPath>
  </defs>

  <rect x="1" y="1" width="298" height="648" rx="34" fill="url(#bez)"/>
  <rect x="1.5" y="1.5" width="297" height="647" rx="33.5" fill="none" stroke="#F4F8F1" stroke-opacity="0.10"/>

  <g clip-path="url(#scr)" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <rect x="10" y="10" width="280" height="630" fill="url(#bg)"/>
    <rect x="10" y="10" width="280" height="630" fill="url(#g1)"/>
    <rect x="10" y="10" width="280" height="630" fill="url(#g2)"/>

    <!-- status bar -->
    <rect x="112" y="18" width="76" height="18" rx="9" fill="#061F14"/>
    <text x="26" y="32" font-size="11" font-weight="600" fill="#F4F8F1" fill-opacity="0.9">9:41</text>
    <g fill="#F4F8F1" fill-opacity="0.85">
      <rect x="226" y="26" width="2.6" height="4" rx="0.9"/>
      <rect x="230.4" y="24" width="2.6" height="6" rx="0.9"/>
      <rect x="234.8" y="22" width="2.6" height="8" rx="0.9"/>
      <rect x="239.2" y="20" width="2.6" height="10" rx="0.9"/>
    </g>
    <path d="M248 25.5a8.5 8.5 0 0 1 11 0" stroke="#F4F8F1" stroke-opacity="0.85" stroke-width="1.7" fill="none" stroke-linecap="round"/>
    <path d="M250.5 28.5a4.8 4.8 0 0 1 6 0" stroke="#F4F8F1" stroke-opacity="0.85" stroke-width="1.7" fill="none" stroke-linecap="round"/>
    <circle cx="253.5" cy="31" r="1.3" fill="#F4F8F1" fill-opacity="0.85"/>
    <rect x="262" y="21.5" width="18" height="10" rx="3" fill="none" stroke="#F4F8F1" stroke-opacity="0.45"/>
    <rect x="264" y="23.5" width="11" height="6" rx="1.6" fill="#F4F8F1" fill-opacity="0.85"/>
    <rect x="281" y="24.5" width="1.6" height="4" rx="0.8" fill="#F4F8F1" fill-opacity="0.45"/>

    <!-- header -->
    <text x="26" y="70" font-size="10.5" fill="#F4F8F1" fill-opacity="0.55" letter-spacing="0.4">Good morning,</text>
    <text x="26" y="93" font-size="23" font-weight="700" font-family="Georgia,'Times New Roman',serif" fill="#F4F8F1">Aiserie</text>
    <circle cx="263" cy="80" r="15" fill="url(#av)"/>
    <text x="263" y="84.5" text-anchor="middle" font-size="13" font-weight="800" fill="#06251A">A</text>

    <!-- safe to spend -->
    <rect x="22" y="106" width="256" height="118" rx="16" fill="#F4F8F1" fill-opacity="0.055" stroke="#F4F8F1" stroke-opacity="0.14"/>
    <text x="38" y="130" font-size="9" font-weight="700" letter-spacing="1.6" fill="#F4F8F1" fill-opacity="0.5">SAFE TO SPEND TODAY</text>
    <text x="38" y="163" font-size="28" font-weight="700" font-family="Georgia,'Times New Roman',serif" fill="#F4F8F1">₱2,480<tspan font-size="15" fill-opacity="0.55">.00</tspan></text>
    <rect x="38" y="178" width="86" height="21" rx="10.5" fill="#34D399" fill-opacity="0.16"/>
    <text x="81" y="192" text-anchor="middle" font-size="9.5" font-weight="700" fill="#34D399">+₱1,200 in</text>
    <rect x="132" y="178" width="86" height="21" rx="10.5" fill="#F87171" fill-opacity="0.16"/>
    <text x="175" y="192" text-anchor="middle" font-size="9.5" font-weight="700" fill="#F87171">−₱840 out</text>

    <!-- quick tiles -->
    <rect x="22" y="236" width="123" height="94" rx="14" fill="#F4F8F1" fill-opacity="0.055" stroke="#F4F8F1" stroke-opacity="0.14"/>
    <rect x="36" y="250" width="24" height="24" rx="8" fill="#22D3EE" fill-opacity="0.16" stroke="#22D3EE" stroke-opacity="0.3"/>
    <rect x="42" y="257.5" width="12" height="9" rx="2" fill="none" stroke="#22D3EE" stroke-width="1.4"/>
    <circle cx="52" cy="262" r="1.5" fill="#22D3EE"/>
    <text x="36" y="298" font-size="15" font-weight="700" font-family="Georgia,'Times New Roman',serif" fill="#F4F8F1">₱48,210</text>
    <text x="36" y="313" font-size="9.5" fill="#F4F8F1" fill-opacity="0.5">Total balance</text>

    <rect x="155" y="236" width="123" height="94" rx="14" fill="#F4F8F1" fill-opacity="0.055" stroke="#F4F8F1" stroke-opacity="0.14"/>
    <rect x="169" y="250" width="24" height="24" rx="8" fill="#0EA5E9" fill-opacity="0.16" stroke="#0EA5E9" stroke-opacity="0.3"/>
    <path d="M181 256v12M175 262h12" stroke="#0EA5E9" stroke-width="1.6" stroke-linecap="round"/>
    <text x="169" y="298" font-size="15" font-weight="700" font-family="Georgia,'Times New Roman',serif" fill="#F4F8F1">68%</text>
    <text x="169" y="313" font-size="9.5" fill="#F4F8F1" fill-opacity="0.5">Savings rate</text>

    <!-- advisor strip -->
    <rect x="22" y="342" width="256" height="38" rx="12" fill="#22D3EE" fill-opacity="0.10" stroke="#22D3EE" stroke-opacity="0.22"/>
    <path d="M40 355.5l1.6 3.9 3.9 1.6-3.9 1.6-1.6 3.9-1.6-3.9-3.9-1.6 3.9-1.6Z" fill="#22D3EE"/>
    <text x="54" y="365" font-size="10" fill="#F4F8F1" fill-opacity="0.85">Advisor: on track — <tspan font-weight="700" fill="#22D3EE">₱780/day</tspan> to payday</text>

    <!-- recent -->
    <rect x="22" y="392" width="256" height="172" rx="16" fill="#F4F8F1" fill-opacity="0.055" stroke="#F4F8F1" stroke-opacity="0.14"/>
    <text x="38" y="416" font-size="9" font-weight="700" letter-spacing="1.6" fill="#F4F8F1" fill-opacity="0.5">RECENT</text>
    <text x="262" y="416" text-anchor="end" font-size="9.5" font-weight="600" fill="#22D3EE">See all</text>
    <line x1="38" y1="428" x2="262" y2="428" stroke="#F4F8F1" stroke-opacity="0.08"/>
    <circle cx="43" cy="447" r="4" fill="#22D3EE"/>
    <text x="54" y="451" font-size="11" fill="#F4F8F1" fill-opacity="0.78">Groceries · market run</text>
    <text x="262" y="451" text-anchor="end" font-size="11" font-weight="700" fill="#F87171">−₱640</text>
    <circle cx="43" cy="477" r="4" fill="#0EA5E9"/>
    <text x="54" y="481" font-size="11" fill="#F4F8F1" fill-opacity="0.78">Salary</text>
    <text x="262" y="481" text-anchor="end" font-size="11" font-weight="700" fill="#34D399">+₱18,000</text>
    <circle cx="43" cy="507" r="4" fill="#34D399"/>
    <text x="54" y="511" font-size="11" fill="#F4F8F1" fill-opacity="0.78">Coffee · café</text>
    <text x="262" y="511" text-anchor="end" font-size="11" font-weight="700" fill="#F87171">−₱215</text>
    <circle cx="43" cy="537" r="4" fill="#A3E635"/>
    <text x="54" y="541" font-size="11" fill="#F4F8F1" fill-opacity="0.78">Utilities · power</text>
    <text x="262" y="541" text-anchor="end" font-size="11" font-weight="700" fill="#F87171">−₱1,120</text>

    <!-- tab bar -->
    <line x1="22" y1="576" x2="278" y2="576" stroke="#F4F8F1" stroke-opacity="0.10"/>
    <text x="54" y="598" text-anchor="middle" font-size="8.5" font-weight="700" letter-spacing="1.2" fill="#22D3EE">HOME</text>
    <circle cx="54" cy="607" r="2.5" fill="#22D3EE"/>
    <text x="118" y="598" text-anchor="middle" font-size="8.5" font-weight="700" letter-spacing="1.2" fill="#F4F8F1" fill-opacity="0.5">WALLETS</text>
    <text x="182" y="598" text-anchor="middle" font-size="8.5" font-weight="700" letter-spacing="1.2" fill="#F4F8F1" fill-opacity="0.5">REPORTS</text>
    <text x="246" y="598" text-anchor="middle" font-size="8.5" font-weight="700" letter-spacing="1.2" fill="#F4F8F1" fill-opacity="0.5">MORE</text>
    <rect x="110" y="628" width="80" height="4" rx="2" fill="#F4F8F1" fill-opacity="0.35"/>
  </g>
</svg>
