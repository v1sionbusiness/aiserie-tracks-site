<svg xmlns="http://www.w3.org/2000/svg" width="300" height="650" viewBox="0 0 300 650" role="img" aria-label="Aiserie Tracks finance screen">
  <defs>
    <linearGradient id="bez" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E4630"/>
      <stop offset="1" stop-color="#0A2418"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F4430"/>
      <stop offset="1" stop-color="#0A2C1C"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.85" cy="0.10" r="0.55">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.08" cy="0.85" r="0.55">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="scr"><rect x="10" y="10" width="280" height="630" rx="24"/></clipPath>
  </defs>

  <rect x="1" y="1" width="298" height="648" rx="34" fill="url(#bez)"/>
  <rect x="1.5" y="1.5" width="297" height="647" rx="33.5" fill="none" stroke="#F4F8F1" stroke-opacity="0.10"/>

  <g clip-path="url(#scr)" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <rect x="10" y="10" width="280" height="630" fill="url(#bg)"/>
    <rect x="10" y="10" width="280" height="630" fill="url(#g1)"/>
