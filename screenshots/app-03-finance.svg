    <path d="M47.8 232.5a4.8 4.8 0 0 1 6.4 0" stroke="#0EA5E9" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <circle cx="51" cy="235.5" r="1.4" fill="#0EA5E9"/>
    <text x="74" y="224" font-size="11.5" font-weight="600" fill="#F4F8F1">Internet</text>
    <text x="74" y="238" font-size="9" fill="#F4F8F1" fill-opacity="0.5">due Dec 3</text>
    <text x="262" y="227" text-anchor="end" font-size="12" font-weight="700" fill="#F4F8F1">−₱1,499</text>

    <rect x="38" y="248" width="26" height="26" rx="8" fill="#F87171" fill-opacity="0.14" stroke="#F87171" stroke-opacity="0.3"/>
    <rect x="44" y="253" width="14" height="16" rx="2" fill="none" stroke="#F87171" stroke-width="1.4"/>
    <path d="M47 258h8M47 261.5h8M47 265h5" stroke="#F87171" stroke-width="1.2" stroke-linecap="round"/>
