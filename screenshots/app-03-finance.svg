    <text x="246" y="598" text-anchor="middle" font-size="8.5" font-weight="700" letter-spacing="1.2" fill="#F4F8F1" fill-opacity="0.5">MORE</text>
    <rect x="110" y="628" width="80" height="4" rx="2" fill="#F4F8F1" fill-opacity="0.35"/>
