    <rect x="38" y="388" width="224" height="6" rx="3" fill="#F4F8F1" fill-opacity="0.10"/>
    <rect x="38" y="388" width="101" height="6" rx="3" fill="#34D399"/>

    <text x="38" y="418" font-size="11.5" font-weight="600" fill="#F4F8F1">Dining out</text>
    <text x="262" y="418" text-anchor="end" font-size="10" fill="#F4F8F1" fill-opacity="0.65">₱1,760 / ₱2,000</text>
    <rect x="38" y="424" width="224" height="6" rx="3" fill="#F4F8F1" fill-opacity="0.10"/>
    <rect x="38" y="424" width="197" height="6" rx="3" fill="#F87171"/>

    <text x="38" y="454" font-size="11.5" font-weight="600" fill="#F4F8F1">Savings</text>
    <text x="262" y="454" text-anchor="end" font-size="10" fill="#F4F8F1" fill-opacity="0.65">₱4,000 / ₱6,000</text>
    <rect x="38" y="460" width="224" height="6" rx="3" fill="#F4F8F1" fill-opacity="0.10"/>
    <rect x="38" y="460" width="149" height="6" rx="3" fill="#A3E635"/>

    <rect x="38" y="482" width="224" height="34" rx="10" fill="#34D399" fill-opacity="0.10" stroke="#34D399" stroke-opacity="0.25"/>
    <path d="M52 493l1.4 3.4 3.4 1.4-3.4 1.4-1.4 3.4-1.4-3.4-3.4-1.4 3.4-1.4Z" fill="#34D399"/>
    <text x="64" y="503" font-size="10" fill="#F4F8F1" fill-opacity="0.85">Month-end projection: <tspan font-weight="700" fill="#34D399">₱31,400</tspan></text>

    <!-- tab bar -->
    <line x1="22" y1="576" x2="278" y2="576" stroke="#F4F8F1" stroke-opacity="0.10"/>
    <text x="54" y="598" text-anchor="middle" font-size="8.5" font-weight="700" letter-spacing="1.2" fill="#F4F8F1" fill-opacity="0.5">HOME</text>
    <text x="118" y="598" text-anchor="middle" font-size="8.5" font-weight="700" letter-spacing="1.2" fill="#F4F8F1" fill-opacity="0.5">WALLETS</text>
    <text x="182" y="598" text-anchor="middle" font-size="8.5" font-weight="700" letter-spacing="1.2" fill="#22D3EE">REPORTS</text>
