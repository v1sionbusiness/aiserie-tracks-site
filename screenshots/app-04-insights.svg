    <rect x="22" y="508" width="256" height="40" rx="12" fill="#22D3EE" fill-opacity="0.10" stroke="#22D3EE" stroke-opacity="0.22"/>
    <path d="M40 522l1.6 4.4 4.4 1.6-4.4 1.6-1.6 4.4-1.6-4.4-4.4-1.6 4.4-1.6Z" fill="#22D3EE"/>
    <text x="54" y="532" font-size="10" fill="#F4F8F1" fill-opacity="0.85">Dining is up 18% vs October — watch it.</text>

