<svg xmlns="http://www.w3.org/2000/svg" width="300" height="650" viewBox="0 0 300 650" role="img" aria-label="Aiserie Tracks wallets screen">
  <defs>
    <linearGradient id="bez" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E4630"/>
      <stop offset="1" stop-color="#0A2418"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F4430"/>
      <stop offset="1" stop-color="#0A2C1C"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.85" cy="0.10" r="0.55">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.08" cy="0.85" r="0.55">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="scr"><rect x="10" y="10" width="280" height="630" rx="24"/></clipPath>
  </defs>

  <rect x="1" y="1" width="298" height="648" rx="34" fill="url(#bez)"/>
  <rect x="1.5" y="1.5" width="297" height="647" rx="33.5" fill="none" stroke="#F4F8F1" stroke-opacity="0.10"/>

  <g clip-path="url(#scr)" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <rect x="10" y="10" width="280" height="630" fill="url(#bg)"/>
    <rect x="10" y="10" width="280" height="630" fill="url(#g1)"/>
    <rect x="10" y="10" width="280" height="630" fill="url(#g2)"/>

    <!-- status bar -->
    <rect x="112" y="18" width="76" height="18" rx="9" fill="#061F14"/>
    <text x="26" y="32" font-size="11" font-weight="600" fill="#F4F8F1" fill-opacity="0.9">9:41</text>
    <g fill="#F4F8F1" fill-opacity="0.85">
      <rect x="226" y="26" width="2.6" height="4" rx="0.9"/>
      <rect x="230.4" y="24" width="2.6" height="6" rx="0.9"/>
      <rect x="234.8" y="22" width="2.6" height="8" rx="0.9"/>
      <rect x="239.2" y="20" width="2.6" height="10" rx="0.9"/>
    </g>
    <path d="M248 25.5a8.5 8.5 0 0 1 11 0" stroke="#F4F8F1" stroke-opacity="0.85" stroke-width="1.7" fill="none" stroke-linecap="round"/>
    <path d="M250.5 28.5a4.8 4.8 0 0 1 6 0" stroke="#F4F8F1" stroke-opacity="0.85" stroke-width="1.7" fill="none" stroke-linecap="round"/>
    <circle cx="253.5" cy="31" r="1.3" fill="#F4F8F1" fill-opacity="0.85"/>
    <rect x="262" y="21.5" width="18" height="10" rx="3" fill="none" stroke="#F4F8F1" stroke-opacity="0.45"/>
    <rect x="264" y="23.5" width="11" height="6" rx="1.6" fill="#F4F8F1" fill-opacity="0.85"/>
    <rect x="281" y="24.5" width="1.6" height="4" rx="0.8" fill="#F4F8F1" fill-opacity="0.45"/>

    <!-- header -->
    <text x="26" y="84" font-size="23" font-weight="700" font-family="Georgia,'Times New Roman',serif" fill="#F4F8F1">Wallets</text>
    <circle cx="264" cy="76" r="14" fill="#F4F8F1" fill-opacity="0.06" stroke="#F4F8F1" stroke-opacity="0.35"/>
    <path d="M264 70v12M258 76h12" stroke="#F4F8F1" stroke-opacity="0.7" stroke-width="1.6" stroke-linecap="round"/>

    <!-- total balance -->
    <rect x="22" y="100" width="256" height="100" rx="16" fill="#F4F8F1" fill-opacity="0.055" stroke="#F4F8F1" stroke-opacity="0.14"/>
    <text x="38" y="124" font-size="9" font-weight="700" letter-spacing="1.6" fill="#F4F8F1" fill-opacity="0.5">TOTAL BALANCE</text>
    <text x="38" y="156" font-size="28" font-weight="700" font-family="Georgia,'Times New Roman',serif" fill="#F4F8F1">₱48,210<tspan font-size="15" fill-opacity="0.55">.00</tspan></text>
    <text x="38" y="178" font-size="9.5" fill="#F4F8F1" fill-opacity="0.6">Across 6 wallets · synced on-device</text>

    <!-- wallet 1 -->
    <rect x="22" y="212" width="256" height="62" rx="14" fill="#F4F8F1" fill-opacity="0.055" stroke="#F4F8F1" stroke-opacity="0.14"/>
    <rect x="36" y="226" width="34" height="34" rx="10" fill="#22D3EE" fill-opacity="0.16" stroke="#22D3EE" stroke-opacity="0.3"/>
    <rect x="46" y="237.5" width="14" height="11" rx="2.5" fill="none" stroke="#22D3EE" stroke-width="1.5"/>
    <circle cx="57.5" cy="243" r="1.7" fill="#22D3EE"/>
    <text x="80" y="241" font-size="12" font-weight="600" fill="#F4F8F1">E-Wallet</text>
    <text x="80" y="258" font-size="9.5" fill="#F4F8F1" fill-opacity="0.5">•• 4821</text>
    <text x="262" y="242" text-anchor="end" font-size="13" font-weight="700" fill="#F4F8F1">₱12,500.00</text>
    <text x="262" y="258" text-anchor="end" font-size="8.5" font-weight="600" fill="#34D399">+₱2,300 this month</text>

    <!-- wallet 2 (privacy curtain) -->
    <rect x="22" y="284" width="256" height="62" rx="14" fill="#F4F8F1" fill-opacity="0.055" stroke="#F4F8F1" stroke-opacity="0.14"/>
    <rect x="36" y="298" width="34" height="34" rx="10" fill="#0EA5E9" fill-opacity="0.16" stroke="#0EA5E9" stroke-opacity="0.3"/>
    <path d="M46.5 311L53 305.5L59.5 311Z" fill="#0EA5E9"/>
    <path d="M48.5 313.5V318.5M53 313.5V318.5M57.5 313.5V318.5" stroke="#0EA5E9" stroke-width="1.5"/>
    <path d="M45.5 320.5H60.5" stroke="#0EA5E9" stroke-width="1.5" stroke-linecap="round"/>
    <text x="80" y="313" font-size="12" font-weight="600" fill="#F4F8F1">Digital Bank</text>
    <text x="80" y="330" font-size="9.5" fill="#F4F8F1" fill-opacity="0.5">•• 9034</text>
    <rect x="194" y="304" width="68" height="20" rx="10" fill="#F4F8F1" fill-opacity="0.95"/>
    <circle cx="207.6" cy="314" r="2" fill="#56584D"/>
    <circle cx="221.2" cy="314" r="2" fill="#56584D"/>
    <circle cx="234.8" cy="314" r="2" fill="#56584D"/>
    <circle cx="248.4" cy="314" r="2" fill="#56584D"/>
    <text x="262" y="334" text-anchor="end" font-size="8.5" font-weight="600" fill="#34D399">+₱900 this month</text>

    <!-- wallet 3 -->
    <rect x="22" y="356" width="256" height="62" rx="14" fill="#F4F8F1" fill-opacity="0.055" stroke="#F4F8F1" stroke-opacity="0.14"/>
    <rect x="36" y="370" width="34" height="34" rx="10" fill="#34D399" fill-opacity="0.16" stroke="#34D399" stroke-opacity="0.3"/>
    <rect x="45" y="381.5" width="16" height="10.5" rx="2" fill="none" stroke="#34D399" stroke-width="1.5"/>
    <circle cx="53" cy="386.75" r="2.2" fill="#34D399"/>
    <text x="80" y="385" font-size="12" font-weight="600" fill="#F4F8F1">Cash envelope</text>
    <text x="80" y="402" font-size="9.5" fill="#F4F8F1" fill-opacity="0.5">Weekly</text>
    <text x="262" y="386" text-anchor="end" font-size="13" font-weight="700" fill="#F4F8F1">₱1,850.00</text>
    <text x="262" y="402" text-anchor="end" font-size="8.5" font-weight="600" fill="#34D399">+₱150 this week</text>

    <!-- add wallet -->
    <rect x="22" y="430" width="256" height="54" rx="14" fill="none" stroke="#22D3EE" stroke-opacity="0.45" stroke-dasharray="6 5"/>
    <path d="M64 451v12M58 457h12" stroke="#22D3EE" stroke-width="1.8" stroke-linecap="round"/>
    <text x="82" y="461" font-size="11" font-weight="600" fill="#22D3EE">Add a wallet — 22 in catalog</text>

    <!-- privacy note -->
    <rect x="22" y="496" width="256" height="38" rx="12" fill="#F4F8F1" fill-opacity="0.055" stroke="#F4F8F1" stroke-opacity="0.14"/>
    <rect x="38" y="511" width="9.5" height="8.5" rx="2" fill="none" stroke="#F4F8F1" stroke-opacity="0.6" stroke-width="1.3"/>
    <path d="M40.5 511v-2.8a2.25 2.25 0 0 1 4.5 0V511" fill="none" stroke="#F4F8F1" stroke-opacity="0.6" stroke-width="1.3"/>
    <circle cx="42.75" cy="515.2" r="1.1" fill="#F4F8F1" fill-opacity="0.6"/>
    <text x="56" y="519" font-size="9.5" fill="#F4F8F1" fill-opacity="0.6">Balances hide when you leave the app</text>

    <!-- tab bar -->
    <line x1="22" y1="576" x2="278" y2="576" stroke="#F4F8F1" stroke-opacity="0.10"/>
    <text x="54" y="598" text-anchor="middle" font-size="8.5" font-weight="700" letter-spacing="1.2" fill="#F4F8F1" fill-opacity="0.5">HOME</text>
    <text x="118" y="598" text-anchor="middle" font-size="8.5" font-weight="700" letter-spacing="1.2" fill="#22D3EE">WALLETS</text>
    <circle cx="118" cy="607" r="2.5" fill="#22D3EE"/>
    <text x="182" y="598" text-anchor="middle" font-size="8.5" font-weight="700" letter-spacing="1.2" fill="#F4F8F1" fill-opacity="0.5">REPORTS</text>
    <text x="246" y="598" text-anchor="middle" font-size="8.5" font-weight="700" letter-spacing="1.2" fill="#F4F8F1" fill-opacity="0.5">MORE</text>
    <rect x="110" y="628" width="80" height="4" rx="2" fill="#F4F8F1" fill-opacity="0.35"/>
  </g>
</svg>
